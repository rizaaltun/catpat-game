name: Development checks

on:
  push:
    branches: [claude/v06-integration, chatgpt/month-01]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create reproducible source snapshot
        run: git archive --format=tar --output=/tmp/catpat-source.tar HEAD
      - name: Retain source snapshot for reproducible inspection
        uses: actions/upload-artifact@v4
        with:
          name: catpat-source-${{ github.sha }}
          path: /tmp/catpat-source.tar
          retention-days: 3
          if-no-files-found: error
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and Chromium
        run: |
          npm ci
          python -m pip install Pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Run gameplay and contract tests
        run: npm test
      - name: Check asset integrity
        if: ${{ !cancelled() }}
        run: npm run test:assets
      - name: Check asset budget
        if: ${{ !cancelled() }}
        run: npm run test:budget
      - name: Audit book-story migration
        if: ${{ !cancelled() && github.ref_name == 'chatgpt/month-01' }}
        continue-on-error: true
        run: python qa/book_story_gate.py
      - name: Retain book-story audit
        if: ${{ always() && github.ref_name == 'chatgpt/month-01' }}
        uses: actions/upload-artifact@v4
        with:
          name: catpat-book-story-${{ github.sha }}
          path: qa/book-story-last-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Render visual checks
        if: ${{ !cancelled() }}
        run: npm run test:visual
      - name: Validate standalone build
        if: ${{ !cancelled() }}
        run: npm run build:test
      - name: Test desktop, mobile, rotation and offline browser flows
        if: ${{ !cancelled() }}
        run: npm run test:browser
      - name: Retain browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: catpat-browser-${{ github.sha }}
          path: qa-browser/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain verified offline playtest
        uses: actions/upload-artifact@v4
        with:
          name: catpat-playtest-${{ github.sha }}
          path: dist/catpat-bolum-1-v05.html
          retention-days: 7
          if-no-files-found: error

# Book-story audit is intentionally non-blocking only while the legacy mission
# migration is active. It becomes blocking when all replacement-required tokens
# have been removed from active runtime source.
# No deployment, domain changes, main merge, repository writes or credentials
# in artifacts. Playtests and screenshots remain CI artifacts, not git files.
