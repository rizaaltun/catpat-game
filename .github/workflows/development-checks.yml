name: Development checks

on:
  push:
    branches: [claude/v06-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create reproducible source snapshot
        run: git archive --format=tar --output=/tmp/catpat-source.tar HEAD
      - name: Retain source snapshot for reproducible inspection
        uses: actions/upload-artifact@v4
        with:
          name: catpat-source-${{ github.sha }}
          path: /tmp/catpat-source.tar
          retention-days: 3
          if-no-files-found: error
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install Pillow numpy
      - name: Run gameplay and contract tests
        run: npm test
      - name: Check asset integrity
        if: ${{ !cancelled() }}
        run: npm run test:assets
      - name: Check asset budget
        if: ${{ !cancelled() }}
        run: npm run test:budget
      - name: Render visual checks
        if: ${{ !cancelled() }}
        run: npm run test:visual
      - name: Validate standalone build
        if: ${{ !cancelled() }}
        run: npm run build:test

# This workflow does not deploy, change domains, merge branches, or write to the repository.
