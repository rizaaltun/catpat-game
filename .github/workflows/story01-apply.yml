name: Validate and apply STORY-01

on:
  push:
    branches: [claude/v06-integration]
    paths:
      - '.github/changes/story01/**'
      - '.github/workflows/story01-apply.yml'

permissions:
  contents: read

concurrency:
  group: story01-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/claude/v06-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact prepared source patch and apply
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.github/changes/story01')
          parts = sorted(root.glob('part-*.b64'))
          assert len(parts) == 4
          patch = gzip.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          expected = '15fdf44a83f08f49a175a016860e2daa98e799a67caca7a80fdc4dc268f831f3'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch hash mismatch'
          path = pathlib.Path('/tmp/story01.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          names = [line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True).splitlines()]
          assert len(names) == 22 and all(not n.startswith(('/', '..', '.github')) for n in names)
          pathlib.Path('/tmp/story01-files').write_bytes(b'\0'.join(n.encode() for n in names)+b'\0')
          print('Verified STORY-01 patch: 22 source/document/test files')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and Chromium
        run: |
          npm ci
          python -m pip install Pillow numpy playwright
          python -m playwright install --with-deps chromium
      - name: Gameplay and contracts
        run: npm test
      - name: Asset integrity
        run: npm run test:assets
      - name: Asset budget
        run: npm run test:budget
      - name: Runtime visual checks
        run: npm run test:visual
      - name: Standalone build
        run: npm run build:test
      - name: Real browser desktop, mobile and offline checks
        run: python tests/story-browser.py
      - name: Publish only the tested change to the integration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -0 git add -- < /tmp/story01-files
          git rm -r .github/changes/story01 .github/workflows/story01-apply.yml
          git diff --cached --check
          git commit -m 'feat: integrate portrait dialogues, companion journey and shared festival' -m 'STORY-01. Full gameplay, asset, budget, runtime visual, standalone, desktop/mobile browser and offline checks passed. Existing art retained; missing new Civciv/ball delivery remains explicitly blocked. Remove one-time validated patch transport.'
          git push origin HEAD:refs/heads/claude/v06-integration
          git rev-parse HEAD > /tmp/story01-commit.txt
          git archive --format=tar --output=/tmp/catpat-story01-source.tar HEAD
      - name: Retain browser evidence even on a failed check
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: story01-browser-${{ github.run_id }}
          path: qa-browser/
          retention-days: 3
          if-no-files-found: warn
      - name: Retain tested source and committed revision
        uses: actions/upload-artifact@v4
        with:
          name: story01-source-${{ github.run_id }}
          path: |
            /tmp/catpat-story01-source.tar
            /tmp/story01-commit.txt
          retention-days: 3
          if-no-files-found: error

# One-time transfer through the connected GitHub API. Hash-verified, no force
# push, no main merge, no deployment. Removes itself after all checks pass.
